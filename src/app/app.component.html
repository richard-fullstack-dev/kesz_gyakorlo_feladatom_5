<div class="container mt-3">
  <router-outlet></router-outlet>
</div>

<div class="container mt-4">
  <h4>Új könyv felvétele</h4>
  <form>
    <div class="mb-2">
      <label for="cim" class="form-label">Cím</label>
      <input type="text" id="cim" name="cim" class="form-control" [(ngModel)]="cim">
    </div>
    <div class="mb-2">
      <label for="isbn" class="form-label">ISBN</label>
      <input type="text" id="isbn" name="isbn" class="form-control" [(ngModel)]="isbn">
    </div>
    <button type="button" id="hozzaad" class="btn btn-primary" (click)="hozzaad()">Hozzáad</button>
  </form>

  <ul id="lista" class="mt-3" >
    <li *ngFor="let item of konyvek">{{item.toString()}}</li>
  </ul>
</div>
